[package]
name = "apimail"
version = "0.4.3"
edition = "2024"
description = "API HTTP en Rust (Axum) para gestionar una cuenta de correo: lectura IMAP, banderas y búsqueda, parseo MIME (texto, HTML y adjuntos), envío SMTP e IDLE con webhook at-least-once sobre cola durable"
license = "MIT"
repository = "https://github.com/atareao/apimail"
readme = "README.md"
keywords = ["email", "imap", "smtp", "axum", "api"]
categories = ["web-programming::http-server", "email"]
rust-version = "1.88"
exclude = [
    "/openspec",
    "/plans",
    "/.opencode",
    "/.github",
    "/CHANGELOG.md",
    "/AGENTS.md",
    "/GIT_FLOW.md",
    "/cliff.toml",
    "/.justfile",
    "/.vampus.yml",
    "/.dockerignore",
    "/Dockerfile",
    "/compose.yml",
    "/.env.j2",
    "/.env.example",
]

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webpki-roots = "1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
