[package]
name = "apimail"
version = "0.1.0"
edition = "2024"
description = "API HTTP en Rust (Axum) para gestionar una cuenta de correo vía IMAP y SMTP"
license = "MIT"
repository = "https://github.com/atareao/apimail"
readme = "README.md"
keywords = ["email", "imap", "smtp", "axum", "api"]
categories = ["web-programming::http-server", "email"]

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
