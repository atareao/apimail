name: Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "openspec/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, verify and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Pin the build timestamp for reproducible layers
        run: |
          set -euo pipefail

          # SOURCE_DATE_EPOCH fija `created`/`history` del config (BuildKit >= 0.11). La
          # anotación org.opencontainers.image.created solo la normalizan los exportadores
          # OCI; el exportador `docker` de aquí publica un manifest schema2 SIN
          # anotaciones, así que el efecto real es sobre `created`/`history` del config.
          # Va al entorno de los pasos siguientes, que es donde buildx lo lee para
          # propagarlo como build arg.
          epoch="$(git log -1 --pretty=%ct)"
          if [ -z "${epoch}" ]; then
            echo "::error::no se pudo leer el timestamp del commit (git log -1 --pretty=%ct)"
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${epoch} (commit $(git rev-parse --short HEAD))"

      - name: Build image without publishing
        run: |
          set -euo pipefail

          # A `uses:` step cannot be retried, so the build runs from the shell to
          # survive transient registry/network failures. The flags mirror what the
          # docker/build-push-action step used to pass.
          #
          # `--output type=docker` es lo mismo que `--load`; `rewrite-timestamp=true`
          # añade la normalización de las fechas de los ficheros de las capas al
          # SOURCE_DATE_EPOCH (BuildKit >= 0.13). Sin ella, dos builds del mismo commit
          # producían digestos distintos: era el único no-determinismo que quedaba.
          wait_s=10
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if docker buildx build \
                 --platform linux/amd64 \
                 --tag apimail:ci \
                 --output type=docker,rewrite-timestamp=true \
                 --cache-from type=gha \
                 --cache-to type=gha,mode=max \
                 .; then
              echo "Build succeeded on attempt ${attempt}"
              # Evidencia auditable por run: el id es el digest del config, que incluye
              # rootfs.diff_ids (hash de las capas descomprimidas) y por eso sí distingue
              # los builds no reproducibles medidos (los dos del commit 45c4355 tenían
              # diff_ids distintos). No es la comprobación completa: el digest autoritativo
              # es el del manifest, que también cubre la compresión de las capas y lo
              # imprimen el push y el paso de verificación post-push.
              echo "Image id: $(docker image inspect --format '{{.Id}}' apimail:ci)"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Build attempt ${attempt} failed; retrying in ${wait_s}s"
              sleep "${wait_s}"
              wait_s=$(( wait_s * 3 ))
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          # Read the expected version straight from Cargo.toml (never hardcoded).
          expected_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "${expected_version}" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          echo "Expected version (from Cargo.toml): ${expected_version}"

          # The mandatory variables get fictitious values: startup is fail-closed,
          # but the IMAP connection is lazy, so nothing reaches the mail server.
          # APIMAIL_WEBHOOK_URL is omitted on purpose (empty disables IDLE).
          docker run -d --name apimail-ci -p 3000:3000 \
            -e APIMAIL_API_KEY=ci \
            -e APIMAIL_IMAP_HOST=imap.invalid \
            -e APIMAIL_IMAP_USER=ci@invalid \
            -e APIMAIL_IMAP_PASSWORD=ci \
            -e APIMAIL_SMTP_HOST=smtp.invalid \
            -e APIMAIL_SMTP_USER=ci@invalid \
            -e APIMAIL_SMTP_PASSWORD=ci \
            apimail:ci

          max_attempts=30
          body=""

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Health check attempt ${attempt}/${max_attempts}"
            http_code="$(curl -s -o /tmp/apimail-health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            body="$(cat /tmp/apimail-health.json 2>/dev/null || true)"
            echo "HTTP ${http_code} - ${body}"
            if [ "${http_code}" = "200" ] \
              && printf '%s' "${body}" | jq -e --arg v "${expected_version}" \
                   '.status == "ok" and .name == "apimail" and .version == $v' > /dev/null 2>&1; then
              echo "Smoke test passed: status ok, name apimail, version ${expected_version}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Smoke test failed after ${max_attempts} attempts"
          docker logs apimail-ci || true
          exit 1

      - name: Verify unprivileged user and writable data volume
        run: |
          set -euo pipefail

          uid="$(docker exec apimail-ci id -u)"
          if [ "${uid}" != "1000" ]; then
            echo "::error::Expected the process to run as uid 1000, got ${uid}"
            docker logs apimail-ci || true
            exit 1
          fi

          docker exec apimail-ci touch /app/data/.ci-write-probe
          echo "Container runs as uid 1000 and /app/data is writable"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce reproducibility against the published reference
        env:
          IMAGE: ghcr.io/atareao/apimail
        run: |
          set -euo pipefail

          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          reference="${IMAGE}:sha-${short_sha}"
          local_id="$(docker image inspect --format '{{.Id}}' apimail:ci)"

          # `sha-<7>` es la referencia inmutable de este mismo commit: si este build no
          # produce exactamente la misma imagen, el `latest` que publicaríamos
          # divergiría de los alias inmutables (el fallo que dejó `latest != v0.4.1`).
          # Se corta aquí, antes de empujar nada.
          #
          # Se reintenta SOLO mientras el ancla no existe: en el flujo de release los
          # runs de `main` y del tag arrancan con segundos de diferencia y tardan lo
          # mismo, así que el hermano puede estar publicándola justo ahora.
          #
          # Un ancla que resuelve pero NO es un manifest simple (p. ej. un índice
          # multi-arch) se trata como fail-closed: no se publica sin poder comparar.
          raw=""
          for attempt in 1 2 3; do
            raw="$(docker buildx imagetools inspect "${reference}" --raw 2>/dev/null || true)"
            if [ -n "${raw}" ]; then
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Reference ${reference} is not published yet (attempt ${attempt}/3); retrying in 10s"
              sleep 10
            fi
          done

          if [ -z "${raw}" ]; then
            echo "No published reference ${reference} after retries: nothing to compare (first build of this commit)"
            exit 0
          fi

          remote_id="$(printf '%s' "${raw}" | jq -r '.config.digest // empty' 2>/dev/null || true)"
          if [ -z "${remote_id}" ]; then
            echo "::error::${reference} exists but carries no single-platform manifest config: refusing to publish without comparing"
            exit 1
          fi

          if [ "${local_id}" != "${remote_id}" ]; then
            echo "::error::Reproducibility broken: ${reference} is ${remote_id} but this build produced ${local_id}"
            exit 1
          fi

          echo "Reproducibility OK: ${reference} matches the freshly built image (${local_id})"

      - name: Tag and publish the verified image
        env:
          IMAGE: ghcr.io/atareao/apimail
        run: |
          set -euo pipefail

          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          tags=()

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              # A manual run may be triggered on any branch: publish only the
              # immutable sha tag and never move `latest`.
              tags=("sha-${short_sha}")
              ;;
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                # Release tag vX.Y.Z -> vX.Y.Z, X.Y, latest and the immutable per-commit
                # anchor (so every build leaves something for the enforcement to compare).
                version="${GITHUB_REF_NAME}"
                if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Unexpected release tag format: ${version}"
                  exit 1
                fi
                minor="${version%.*}"
                tags=("${version}" "${minor#v}" "latest" "sha-${short_sha}")
              else
                # Push to main -> latest and the short-sha tag.
                tags=("latest" "sha-${short_sha}")
              fi
              ;;
            *)
              echo "::error::Unsupported event: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

          : > image-tags.txt
          for tag in "${tags[@]}"; do
            printf '%s\n' "${tag}" >> image-tags.txt
            docker tag apimail:ci "${IMAGE}:${tag}"
          done

          for tag in "${tags[@]}"; do
            docker push "${IMAGE}:${tag}"
          done

      - name: Verify the published image is pullable and healthy
        env:
          IMAGE: ghcr.io/atareao/apimail
        run: |
          set -euo pipefail

          expected_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "${expected_version}" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi

          # The smoke-test container still holds port 3000; free it before running
          # the image that was actually published.
          docker rm -f apimail-ci > /dev/null 2>&1 || true

          while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "::group::Verifying ${IMAGE}:${tag}"
            docker pull "${IMAGE}:${tag}"

            docker run -d --name apimail-published -p 3000:3000 \
              -e APIMAIL_API_KEY=ci \
              -e APIMAIL_IMAP_HOST=imap.invalid \
              -e APIMAIL_IMAP_USER=ci@invalid \
              -e APIMAIL_IMAP_PASSWORD=ci \
              -e APIMAIL_SMTP_HOST=smtp.invalid \
              -e APIMAIL_SMTP_USER=ci@invalid \
              -e APIMAIL_SMTP_PASSWORD=ci \
              "${IMAGE}:${tag}"

            healthy=0
            for attempt in $(seq 1 15); do
              http_code="$(curl -s -o /tmp/published-health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
              body="$(cat /tmp/published-health.json 2>/dev/null || true)"
              if [ "${http_code}" = "200" ] \
                && printf '%s' "${body}" | jq -e --arg v "${expected_version}" \
                     '.status == "ok" and .name == "apimail" and .version == $v' > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "${healthy}" != "1" ]; then
              echo "::error::Published image ${IMAGE}:${tag} did not pass the health check"
              docker logs apimail-published || true
              exit 1
            fi

            echo "Published image ${IMAGE}:${tag} is pullable and healthy"
            docker rm -f apimail-published > /dev/null 2>&1 || true
            echo "::endgroup::"
          done < image-tags.txt
